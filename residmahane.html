<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>گزارش رسید ماهانه</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,"Vazirmatn",Arial,sans-serif;font-size:14px;background:#f3f6fa;color:#1d2733;line-height:1.7}
.topbar{background:#1f3a5f;color:#fff;position:sticky;top:0;z-index:20}
.topbar-inner{max-width:1100px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.brand{font-weight:bold;font-size:16px}
.brand span{font-weight:normal;opacity:.7;font-size:12px;margin-right:8px}
.nav{display:flex;gap:6px}
.nav a{color:#dbe6f5;padding:6px 14px;border-radius:6px;cursor:pointer;text-decoration:none}
.nav a:hover{background:rgba(255,255,255,.12)}
.nav a.active{background:#fff;color:#1f3a5f;font-weight:bold}
.container{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:10px;margin-bottom:14px}
h1{margin:0 0 4px;font-size:20px;color:#1f3a5f}
h2{margin:0 0 10px;font-size:16px;color:#1f3a5f}
.subtle{color:#5b6b7e;margin:0}
.small{font-size:12px}
.muted{color:#8a97a8}
.actions{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.btn{font-family:inherit;font-size:13px;border:1px solid transparent;border-radius:6px;padding:8px 16px;cursor:pointer}
.btn:disabled{opacity:.6;cursor:wait}
.btn-primary{background:#1f3a5f;color:#fff}
.btn-primary:hover{background:#2a4d7d}
.btn-ghost{background:#fff;color:#1f3a5f;border-color:#b9c8db}
.btn-ghost:hover{background:#eef3f9}
.btn-sm{padding:3px 10px;font-size:12px}
.banner{padding:10px 14px;border-radius:6px;margin-bottom:12px;border:1px solid}
.banner.ok{background:#e8f6ec;border-color:#9ad3a8;color:#1d5a2e}
.banner.warn{background:#fff6e0;border-color:#e8cf8a;color:#7a5a00}
.banner.err{background:#fdeaea;border-color:#e6a1a1;color:#8a1f1f}
.card{background:#fff;border:1px solid #d8e1ec;border-radius:10px;padding:16px;margin-bottom:16px}
.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:160px}
.field.wide{min-width:240px;flex:1}
.field label{font-size:12px;color:#5b6b7e}
input[type=text],select,input[type=file]{font-family:inherit;font-size:13px;padding:7px 10px;border:1px solid #b9c8db;border-radius:6px;background:#fff;width:100%}
input[readonly]{background:#eef1f5}
.grid-form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-foot{display:flex;gap:8px;margin-top:16px}
.table-wrap{background:#fff;border:1px solid #d8e1ec;border-radius:10px;overflow-x:auto;margin-bottom:16px}
table{width:100%;border-collapse:collapse}
table.data th,table.lines-table th{background:#1f3a5f;color:#fff;padding:9px 10px;text-align:center;font-size:13px}
table.data td,table.lines-table td{padding:8px 10px;border-bottom:1px solid #e3eaf3;text-align:center}
table.data td.text{text-align:right}
table.data tbody tr:nth-child(even){background:#f7f9fc}
table.data tfoot td{background:#e3eaf3;font-weight:bold;padding:9px 10px;text-align:center}
table.data tfoot td.text{text-align:right}
tr.month-row td{background:#e3eaf3!important;font-weight:bold;color:#1f3a5f;text-align:right}
td.empty{padding:24px;color:#8a97a8}
.num-cell{font-variant-numeric:tabular-nums}
.ltr{direction:ltr}
.group-tag{background:#eaf1fb;color:#1f3a5f;padding:2px 8px;border-radius:10px;font-size:12px}
.rule-list{margin:14px 0 0;padding:0 18px;color:#44546a}
.rule-list li{margin-bottom:4px}
.error-list{margin:0;padding:0 18px;color:#8a1f1f;max-height:260px;overflow:auto}
.lines-table input{padding:5px 8px}
.pagination{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pagination a,.pagination .current{padding:4px 10px;border:1px solid #b9c8db;border-radius:6px;background:#fff;color:#1f3a5f;text-decoration:none}
.pagination .current{background:#1f3a5f;color:#fff}
.print-head{text-align:center;margin-bottom:12px}
.print-title{font-size:20px;font-weight:bold;color:#1f3a5f}
.dp-wrap{position:relative}
.dp-pop{display:none;position:absolute;top:100%;right:0;z-index:30;background:#fff;border:1px solid #b9c8db;border-radius:8px;padding:8px;width:260px;box-shadow:0 6px 20px rgba(0,0,0,.15);margin-top:4px}
.dp-pop.open{display:block}
.dp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dp-head button{border:0;background:#eef3f9;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:16px}
.dp-title{font-weight:bold;color:#1f3a5f}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.dp-grid .wd{font-size:11px;color:#8a97a8;padding:2px 0}
.dp-grid button{border:0;background:transparent;border-radius:6px;padding:5px 0;cursor:pointer;font-family:inherit}
.dp-grid button:hover{background:#eef3f9}
.dp-grid button.today{border:1px solid #1f3a5f}
.dp-grid button.sel{background:#1f3a5f;color:#fff}
@media(max-width:640px){.grid-form{grid-template-columns:1fr}}
@media print{.topbar,.no-print,.actions,.filters{display:none!important}body{background:#fff}.card,.table-wrap{border:0}}
</style>

var HEADERS = {
  permitDate: ['تاریخ مجوز ورود'],
  docNo: ['شماره سند انبار'],
  permitNo: ['شماره مجوز ورود'],
  permitQty: ['مقدار کالا مجوز ورود'],

  docQty: ['مقدار سند انبار'],
  batch: ['توضیحات سربرگ مجوز ورود', 'توضیحات سربرگ'],
  permitType: ['نوع مجوز مجوز ورود', 'نوع مجوز'],
  lineNote: ['توضیحات قلم کالا مجوز ورود'],
  group: ['گروه محصول']
};
var CATALOG_HEADERS = {
  code: ['کد'],
  family: ['عنوان'],
  category: ['دسته بندی'],
  name: ['نام محصول']
};

function norm(value) {
  return String(value == null ? '' : value)
    .replace(/\u200c/g, ' ')
    .replace(/[يى]/g, 'ی')
    .replace(/ك/g, 'ک')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase();
}
function text(value) {
  if (value == null) return '';
  if (value instanceof Date) return value.toISOString().slice(0, 10);
  return String(value).trim();
}
function parseJalali(value) {
  if (value == null || value === '') return null;
  if (value instanceof Date) {
    var j = J.toJalaali(value.getUTCFullYear(), value.getUTCMonth() + 1, value.getUTCDate());
    return J.format(j);
  }
  var parsed = J.parse(toLatinDigits(value).replace(/[-.]/g, '/').trim());
  return parsed ? J.format(parsed) : null;
}
function headerMap(headerRow) {
  var map = new Map();
  (headerRow || []).forEach(function (value, index) {
    var key = norm(value);
    if (key && !map.has(key)) map.set(key, index);
  });
  return map;
}
function findColumn(map, aliases) {
  for (var i = 0; i < aliases.length; i += 1) {
    var key = norm(aliases[i]);
    if (map.has(key)) return map.get(key);
  }
  return null;
}
function detectSheet(sheet, aliases) {
  var map = headerMap(sheet.rows[0]);
  var cols = {};
  var found = 0;
  Object.keys(aliases).forEach(function (field) {
    var col = findColumn(map, aliases[field]);
    cols[field] = col;
    if (col !== null) found += 1;
  });
  return { sheet: sheet, cols: cols, found: found };
}
function isEmptyRow(row) {
  return !row || row.every(function (v) { return v == null || String(v).trim() === ''; });
}
function extractCatalog(wb) {
  for (var s = 0; s < wb.sheets.length; s += 1) {
    var sheet = wb.sheets[s];
    var det = detectSheet(sheet, CATALOG_HEADERS);
    if (det.found === 4) {
      var rows = [];
      for (var r = 1; r < sheet.rows.length; r += 1) {
        var row = sheet.rows[r];
        if (isEmptyRow(row)) continue;
        var cell = function (field) { return det.cols[field] != null ? row[det.cols[field]] : null; };
        var code = toLatinDigits(text(cell('code'))).trim();
        if (!code) continue;
        rows.push({
          c: code,
          f: text(cell('family')) || 'نامشخص',
          g: text(cell('category')) || 'نامشخص',
          n: text(cell('name')) || code
        });
      }
      return { sheet: sheet.name, rows: rows };
    }
  }
  return null;
}
function extractReceipts(wb) {
  for (var s = 0; s < wb.sheets.length; s += 1) {
    var sheet = wb.sheets[s];
    var det = detectSheet(sheet, HEADERS);
    var required = ['permitDate', 'itemCode', 'itemName', 'mainQty'];
    var ok = required.every(function (field) { return det.cols[field] != null; }) && det.found >= 8;
    if (!ok) continue;

    var records = [];
    var errors = [];
    for (var r = 1; r < sheet.rows.length; r += 1) {
      var row = sheet.rows[r];
      if (isEmptyRow(row)) continue;
      var cell = function (field) { return det.cols[field] != null ? row[det.cols[field]] : null; };
      if (!text(cell('permitDate')) && !text(cell('itemCode'))) continue;

      var permitDate = parseJalali(cell('permitDate'));
      var docDate = parseJalali(cell('docDate'));
      var code = toLatinDigits(text(cell('itemCode'))).trim();
      var name = text(cell('itemName'));
      var mainQty = parseNumber(cell('mainQty'));
      var excelRow = r + 1;

      var problems = [];
      if (!permitDate) problems.push('تاریخ مجوز ورود نامعتبر است');
      if (!code) problems.push('کد کالا خالی است');
      if (!name) problems.push('عنوان کالا خالی است');
      if (mainQty == null || isNaN(mainQty)) problems.push('مقدار واحد اصلی نامعتبر است');

      if (problems.length) {
        errors.push({ row: excelRow, message: problems.join('، ') });
        continue;
      }

      var permitQty = parseNumber(cell('permitQty'));
      var docQty = parseNumber(cell('docQty'));
      records.push({
        row: excelRow,
        permitDate: permitDate,
        docDate: docDate,
        docNo: text(cell('docNo')),
        permitNo: text(cell('permitNo')),
        permitQty: isNaN(permitQty) ? null : permitQty,
        itemCode: code,
        itemName: name,
        mainQty: mainQty,
        docQty: isNaN(docQty) ? null : docQty,
        batch: text(cell('batch')),
        permitType: text(cell('permitType')) || 'تولید'
      });
    }
    return { sheet: sheet.name, records: records, errors: errors };
  }
  return null;
}

  dirty = true;

    localStorage.setItem(LS_KEY, JSON.stringify(state));
    saveError = false;
  } catch (e) {
    saveError = true;
  }
  updateDirtyBadge();
}

function saveToHtmlFile() {
  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var json = JSON.stringify(state).replace(/</g, '\\u003c');
  var re = /(<script type="application\/json" id="embedded-data">)[\s\S]*?(<\/script>)/;
  if (!re.test(html)) {
    alert('بلوک داده جاسازی‌شده در فایل پیدا نشد. لطفاً فایل را دوباره از نسخه اصلی دریافت کنید.');
    return false;
  }
  html = html.replace(re, '$1' + json + '$2');
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  var today = J.format(J.today()).replace(/\//g, '-');
  a.download = 'receipt-report-' + today + '.html';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}

function loadState() {
  // ۱. اول از داده جاسازی‌شده در خود فایل
  try {
    var el = document.getElementById('embedded-data');
    if (el) {
      var parsed = JSON.parse(el.textContent);
      if (parsed && Array.isArray(parsed.products) && Array.isArray(parsed.receipts)) {
        if (parsed.products.length || parsed.receipts.length) return parsed;
      }
    }
  } catch (e) { /* ignore */ }

  // ۲. سپس localStorage (تغییرات ذخیره‌نشده)
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var parsed2 = JSON.parse(raw);
      if (parsed2 && Array.isArray(parsed2.products)) return parsed2;
    }
  } catch (e) { /* ignore */ }

  // ۳. سپس SEED
  if (SEED) {
    var st = emptyState();
    st.products = SEED.products.map(function (p) { return { c: p[0], f: p[1], g: p[2], n: p[3] }; });
    st.receipts = SEED.receipts.map(function (r) {
      return { pd: r[0], dn: r[1], pn: r[2], pq: r[3], dd: r[4], ic: r[5], nm: r[6], mq: r[7], dq: r[8], bt: r[9], pt: r[10], g: r[11] };
    });
    return st;
  }
  return emptyState();
}

function productMap() {
  var map = new Map();
  state.products.forEach(function (p) { map.set(p.c, p); });
  return map;
}

function applyImport(wb, fileName) {
  var catalog = extractCatalog(wb);
  var receipts = extractReceipts(wb);

  if (!receipts) {
    return { ok: false, message: 'شیت رکوردها با سرستون‌های موردنیاز پیدا نشد. ستون‌های «کد کالا»، «عنوان کالا»، «مقدار به واحد اصلی» و «تاریخ مجوز ورود» لازم است.' };
  }
  if (!receipts.records.length && receipts.errors.length) {
    return { ok: false, message: 'هیچ ردیف سالمی در فایل پیدا نشد.', errors: receipts.errors.slice(0, 50) };
  }

  var pmap = productMap();
  if (catalog) catalog.rows.forEach(function (p) { pmap.set(p.c, p); });

  var errors = receipts.errors.slice();
  var unknownMap = new Map();
  receipts.records.forEach(function (rec) {
    if (!pmap.has(rec.itemCode)) {
      if (!unknownMap.has(rec.itemCode)) unknownMap.set(rec.itemCode, { code: rec.itemCode, name: rec.itemName });
      errors.push({ row: rec.row, message: 'کد کالا ' + rec.itemCode + ' در کاتالوگ محصول تعریف نشده است' });
    }
  });
  if (errors.length) {
    errors.sort(function (a, b) { return a.row - b.row; });
    return {
      ok: false,
      message: 'ایمپورت انجام نشد: ' + errors.length + ' ردیف دارای خطا است. کدهای ناموجود در کاتالوگ را در همین صفحه تعریف کنید و دوباره فایل را ایمپورت کنید.',
      errors: errors.slice(0, 100),
      unknowns: Array.from(unknownMap.values())
    };
  }

  var months = Array.from(new Set(receipts.records.map(function (r) { return r.permitDate.slice(0, 7); }))).sort();
  var monthSet = new Set(months);
  state.receipts = state.receipts.filter(function (r) { return !monthSet.has(r.pd.slice(0, 7)); });
  receipts.records.forEach(function (rec) {
    var p = pmap.get(rec.itemCode);
    state.receipts.push({
      pd: rec.permitDate, dn: rec.docNo, pn: rec.permitNo, pq: rec.permitQty, dd: rec.docDate,
      ic: rec.itemCode, nm: rec.itemName, mq: rec.mainQty, dq: rec.docQty, bt: rec.batch, pt: rec.permitType,
      g: p.g
    });
  });
  if (catalog) {
    var existing = productMap();
    catalog.rows.forEach(function (p) {
      var cur = existing.get(p.c);
      if (cur) { cur.f = p.f; cur.g = p.g; cur.n = p.n; }
      else state.products.push(p);
    });
  }
  state.importRec = {
    fileName: fileName,
    months: months.join('، '),
    receiptRows: receipts.records.length,
    productRows: catalog ? catalog.rows.length : 0,
    at: nowLabel()
  };
  save();
  return { ok: true, months: months, receiptRows: receipts.records.length, productRows: catalog ? catalog.rows.length : 0 };
}

/* ================= report computation ================= */
function groupSortKey(name) {
  var s = toLatinDigits(name).replace(/٫/g, '.').replace(/\//g, '.');
  var m = s.match(/\d+(?:\.\d+)?/);
  return {
    prefix: m ? s.slice(0, m.index).trim() : s.trim(),
    size: m ? Number(m[0]) : Number.MAX_SAFE_INTEGER,
    name: s
  };
}
function compareGroups(a, b) {
  var ka = groupSortKey(a), kb = groupSortKey(b);
  var byPrefix = ka.prefix.localeCompare(kb.prefix, 'fa');
  if (byPrefix) return byPrefix;
  if (ka.size !== kb.size) return ka.size - kb.size;
  return ka.name.localeCompare(kb.name, 'fa');
}

function distinctMonths() {
  var set = new Set();
  state.receipts.forEach(function (r) { set.add(r.pd.slice(0, 7)); });
  return Array.from(set).sort().reverse();
}
function distinctGroups() {
  var set = new Set();
  state.receipts.forEach(function (r) { set.add(r.g); });
  return Array.from(set).sort(compareGroups);
}
function latestMonth() {
  var months = distinctMonths();
  return months.length ? months[0] : '';
}

function readFilter(input) {
  var warnings = [];
  var month = input.month;
  if (month === undefined || month === null || month === '') month = latestMonth();
  if (month === 'all') month = '';
  var pf = J.parse(toLatinDigits(input.from));
  var pt = J.parse(toLatinDigits(input.to));
  var from = pf ? J.format(pf) : '';
  var to = pt ? J.format(pt) : '';
  if (input.from && !from) warnings.push('تاریخ «از» نامعتبر بود و نادیده گرفته شد.');
  if (input.to && !to) warnings.push('تاریخ «تا» نامعتبر بود و نادیده گرفته شد.');
  if (from && to && from > to) { var t = from; from = to; to = t; warnings.push('تاریخ شروع و پایان جابه‌جا شده بود و اصلاح شد.'); }
  var group = String(input.group || '').trim();
  return { month: month, from: from, to: to, group: group, warnings: warnings };
}

function filterText(f) {
  var parts = [];
  parts.push(f.month ? 'ماه: ' + monthLabel(f.month) : 'ماه: همه');
  if (f.from) parts.push('از تاریخ: ' + faDigits(f.from));
  if (f.to) parts.push('تا تاریخ: ' + faDigits(f.to));
  if (f.group) parts.push('گروه: ' + f.group);
  parts.push('مبنای تاریخ: مجوز ورود');
  return parts.join('  |  ');
}

function reportRows(f) {
  var agg = new Map();
  state.receipts.forEach(function (r) {
    if (f.month && r.pd.slice(0, 7) !== f.month) return;
    if (f.from && r.pd < f.from) return;
    if (f.to && r.pd > f.to) return;
    if (f.group && r.g !== f.group) return;
    var key = r.pd.slice(0, 7) + '|' + r.g;
    var cur = agg.get(key);
    if (!cur) { cur = { month: r.pd.slice(0, 7), group: r.g, mainQty: 0 }; agg.set(key, cur); }
    cur.mainQty += r.mq || 0;
  });
  var rows = Array.from(agg.values());
  rows.sort(function (a, b) {
    if (a.month !== b.month) return a.month < b.month ? -1 : 1;
    return compareGroups(a.group, b.group);
  });
  return rows;
}

    for (var pnum = start; pnum <= end; pnum += 1) {
      parts.push(pnum === page
        ? '<span class="current">' + faDigits(pnum) + '</span>'
        : '<a href="#" data-page-no="' + pnum + '">' + faDigits(pnum) + '</a>');
    }
    if (page < pages) parts.push('<a href="#" data-page-no="' + (page + 1) + '">بعدی</a>');
    parts.push('<span class="muted">از ' + faDigits(pages) + ' صفحه</span>');
    pager = '<div class="pagination">' + parts.join('') + '</div>';
  }

  app.innerHTML =
    '<div class="page-head"><div><h1>کاتالوگ کالا</h1>' +
    '<p class="subtle">' + fmtInt(filtered.length) + ' کد کالا — مرجع تشخیص گروه محصول</p></div>' +
    '<div class="actions"><button class="btn btn-primary" id="btn-add">افزودن دستی کالا</button></div></div>' +
    saveWarn() +
    (ui.catalogMsg ? banner(ui.catalogMsg.text, ui.catalogMsg.type) : '') +
    '<div class="card"><h2>ایمپورت کاتالوگ از اکسل</h2>' +
    '<form id="catalog-import-form"><div class="field" style="max-width:420px">' +
    '<label for="catalog-file">فایل Excel (xlsx)</label>' +
    '<input type="file" id="catalog-file" accept=".xlsx,.xlsm" required></div>' +
    '<div class="actions" style="margin-top:12px"><button type="submit" class="btn btn-primary" id="catalog-import-btn">ایمپورت و جایگزینی کاتالوگ</button></div></form>' +
    '<ul class="rule-list"><li>ستون‌های فایل: <strong>کد، عنوان، دسته بندی، نام محصول</strong> (ردیف اول سرستون).</li>' +
    '<li>با هر ایمپورت، <strong>کل کاتالوگ قبلی پاک</strong> و با محتوای فایل جایگزین می‌شود.</li>' +
    '<li>در کدهای تکراری، ردیف آخر ملاک است. گروه رسیدهای ثبت‌شده هم با کاتالوگ جدید هماهنگ می‌شود.</li>' +
    '<li>برای افزودن یا ویرایش تکی، از «افزودن دستی کالا» و دکمه‌های ردیف‌ها استفاده کنید.</li></ul></div>' +
    '<div class="card"><form class="filters" id="catalog-form">' +
    '<div class="field wide"><label for="catalog-q">جستجو (کد، نام محصول، عنوان، دسته‌بندی)</label>' +
    '<input type="text" id="catalog-q" value="' + esc(q) + '"></div>' +
    '<div class="actions"><button type="submit" class="btn btn-primary">جستجو</button>' +
    '<button type="button" class="btn btn-ghost" id="catalog-clear">پاک‌کردن</button></div>' +
    '</form></div>' +
    '<div class="table-wrap"><table class="data">' +
    '<thead><tr><th style="width:150px">کد کالا</th><th style="width:200px">عنوان</th><th style="width:220px">دسته‌بندی (گروه محصول)</th><th>نام محصول</th><th style="width:90px" class="no-print">عملیات</th></tr></thead>' +
    '<tbody>' + rowsHtml + '</tbody></table></div>' + pager;

  document.getElementById('catalog-form').addEventListener('submit', function (e) {
    e.preventDefault();
    ui.catalogQ = document.getElementById('catalog-q').value;
    ui.catalogPage = 1;
    render();
  });
  document.getElementById('catalog-clear').addEventListener('click', function () {
    ui.catalogQ = '';
    ui.catalogPage = 1;
    render();
  });
  document.getElementById('btn-add').addEventListener('click', function () {
    ui.form = { mode: 'new', code: '', f: '', g: '', n: '' };
    render();
  });
  document.getElementById('catalog-import-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var file = document.getElementById('catalog-file').files[0];
    if (!file) return;
    var btn = document.getElementById('catalog-import-btn');
    btn.disabled = true;
    btn.textContent = 'در حال پردازش…';
    file.arrayBuffer().then(function (buf) { return readXlsx(buf); }).then(function (wb) {
      var cat = extractCatalog(wb);
      if (!cat || !cat.rows.length) throw new Error('شیتی با سرستون‌های «کد، عنوان، دسته بندی، نام محصول» یا ردیف معتبر پیدا نشد؛ کاتالوگ قبلی دست‌نخورده ماند.');
      var map = new Map();
      cat.rows.forEach(function (p) { map.set(p.c, p); });
      var dups = cat.rows.length - map.size;
      if (!confirm('کاتالوگ فعلی (' + state.products.length + ' کالا) کاملاً پاک و با ' + map.size + ' کالای فایل جایگزین می‌شود. ادامه می‌دهید؟')) { render(); return; }
      state.products = Array.from(map.values());
      var unmatched = 0;
      state.receipts.forEach(function (r) {
        var p = map.get(r.ic);
        if (p) r.g = p.g; else unmatched += 1;
      });
      save();
      ui.catalogQ = '';
      ui.catalogPage = 1;
      ui.catalogMsg = { type: 'ok', text: 'کاتالوگ جایگزین شد: ' + faDigits(map.size) + ' کالا' +
        (dups ? ' (' + faDigits(dups) + ' ردیف تکراری حذف شد)' : '') +
        (unmatched ? ' — ' + faDigits(unmatched) + ' ردیف رسید کدی خارج از کاتالوگ جدید دارد و گروه قبلی را نگه داشت.' : '') };
      render();
    }).catch(function (err) {
      ui.catalogMsg = { type: 'err', text: err && err.message ? err.message : 'خواندن فایل با خطا روبه‌رو شد.' };
      render();
    });
  });
  app.querySelectorAll('[data-copy]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var p = productMap().get(btn.getAttribute('data-copy'));
      if (!p) return;
      ui.form = { mode: 'copy', code: '', f: p.f, g: p.g, n: p.n, sourceCode: p.c };
      render();
    });
  });
  app.querySelectorAll('[data-edit]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var p = productMap().get(btn.getAttribute('data-edit'));
      if (!p) return;
      ui.form = { mode: 'edit', code: p.c, f: p.f, g: p.g, n: p.n };
      render();
    });
  });
  app.querySelectorAll('[data-page-no]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      e.preventDefault();
      ui.catalogPage = Number(a.getAttribute('data-page-no'));
      render();
    });
  });
}

function renderCatalogForm() {
  var form = ui.form || { mode: 'new', code: '', f: '', g: '', n: '' };
  var edit = form.mode === 'edit';
  var copy = form.mode === 'copy';
  var heading = edit ? 'ویرایش کالا' : copy ? 'افزودن کالا با کپی' : 'افزودن کالا';
  var hint = edit
    ? 'عنوان، دسته‌بندی و نام محصول قابل تغییر است؛ کد کالا ثابت است.'
    : copy
      ? 'فیلدها از کد ' + faDigits(form.sourceCode || '') + ' کپی شده‌اند؛ فقط کد کالای جدید را وارد کنید.'
      : 'کد کالا باید یکتا باشد و پس از ذخیره قابل تغییر نیست.';

  app.innerHTML =
    '<div class="page-head"><div><h1>' + heading + '</h1><p class="subtle">' + esc(hint) + '</p></div>' +
    '<div class="actions"><button class="btn btn-ghost" id="form-back">بازگشت به کاتالوگ</button></div></div>' +
    banner(form.error, 'err') +
    '<form id="catalog-form-page"><div class="card"><div class="grid-form">' +
    '<div class="field"><label for="p-code">کد کالا *</label>' +
    '<input type="text" id="p-code" value="' + esc(form.code || '') + '"' + (edit ? ' readonly' : '') + ' inputmode="numeric" required' + (copy ? ' autofocus' : '') + '></div>' +
    '<div class="field"><label for="p-family">عنوان *</label>' +
    '<input type="text" id="p-family" value="' + esc(form.f || '') + '" required></div>' +
    '<div class="field"><label for="p-category">دسته‌بندی (گروه محصول) *</label>' +
    '<input type="text" id="p-category" value="' + esc(form.g || '') + '" required></div>' +
    '<div class="field" style="grid-column:1/-1"><label for="p-name">نام محصول *</label>' +
    '<input type="text" id="p-name" value="' + esc(form.n || '') + '" required></div>' +
    '</div>' +
    '<div class="form-foot">' +
    '<button type="submit" class="btn btn-primary">' + (edit ? 'ذخیره تغییرات' : 'افزودن کالا') + '</button>' +
    '<button type="button" class="btn btn-ghost" id="form-cancel">انصراف</button>' +
    '</div></div></form>';

  document.getElementById('form-back').addEventListener('click', function () { ui.form = null; render(); });
  document.getElementById('form-cancel').addEventListener('click', function () { ui.form = null; render(); });
  document.getElementById('catalog-form-page').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = toLatinDigits(document.getElementById('p-code').value || '').trim();
    var f = document.getElementById('p-family').value.trim();
    var g = document.getElementById('p-category').value.trim();
    var n = document.getElementById('p-name').value.trim();
    var errors = [];
    if (!edit && !/^\d{6,20}$/.test(code)) errors.push('کد کالا باید ۶ تا ۲۰ رقم باشد.');
    if (!f) errors.push('عنوان الزامی است.');
    if (!g) errors.push('دسته‌بندی الزامی است.');
    if (!n) errors.push('نام محصول الزامی است.');
    var pmap = productMap();
    if (!edit && pmap.has(code)) errors.push('این کد کالا قبلاً ثبت شده است.');
    if (errors.length) {
      ui.form = { mode: form.mode, code: code, f: f, g: g, n: n, sourceCode: form.sourceCode, error: errors.join(' ') };
      render();
      return;
    }
    if (edit) {
      var p = pmap.get(form.code);
      if (p) {
        p.f = f; p.g = g; p.n = n;
        state.receipts.forEach(function (r) { if (r.ic === p.c) r.g = g; });
      }
    } else {
      state.products.push({ c: code, f: f, g: g, n: n });
    }
    save();
    ui.form = null;
    ui.catalogQ = code;
    ui.catalogPage = 1;
    ui.page = 'catalog';
    render();
  });
}

/* ================= export & print ================= */
function buildReportWorkbook(rows, total, fText, showMonth) {
  var headerLabels = showMonth
    ? ['ردیف', 'ماه', 'گروه محصول', 'مقدار به واحد اصلی (کیلوگرم)']
    : ['ردیف', 'گروه محصول', 'مقدار به واحد اصلی (کیلوگرم)'];
  var widths = showMonth ? [8, 14, 48, 28] : [8, 56, 28];
  var lastCol = showMonth ? 'D' : 'C';

  var outRows = [];
  outRows.push({ h: 26, cells: [{ v: 'گزارش رسید ماهانه', s: 2, t: 'str' }] });
  outRows.push({ h: 20, cells: [{ v: fText || '', s: 3, t: 'str' }] });
  outRows.push({ cells: [] });
  outRows.push({ h: 34, cells: headerLabels.map(function (label) { return { v: label, s: 1, t: 'str' }; }) });

  rows.forEach(function (r, i) {
    var cells = [{ v: i + 1, s: 4 }];
    if (showMonth) cells.push({ v: r.month, s: 4, t: 'str' });
    cells.push({ v: r.group, s: 5, t: 'str' });
    cells.push({ v: r.mainQty || 0, s: 6 });
    outRows.push({ h: 20, cells: cells });
  });

  var totalCells = [{ v: '', s: 8 }];
  if (showMonth) totalCells.push({ v: '', s: 8 });
  totalCells.push({ v: 'جمع کل', s: 10, t: 'str' });
  totalCells.push({ v: total || 0, s: 9 });
  outRows.push({ h: 22, cells: totalCells });

  var lastRow = outRows.length;
  return writeXlsx({
    sheetName: 'گزارش',
    cols: widths,
    rows: outRows,
    merges: ['A1:' + lastCol + '1', 'A2:' + lastCol + '2'],
    autoFilter: 'A4:' + lastCol + (lastRow - 1),
    freezeRows: 4
  });
}

function doExport() {
  var f = readFilter(ui.filter);
  var rows = reportRows(f);
  var total = rows.reduce(function (acc, r) { return acc + (r.mainQty || 0); }, 0);
  var buffer = buildReportWorkbook(rows, total, filterText(f), !f.month);
  var blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'receipt-report-' + (f.month || 'all').replace('/', '-') + '.xlsx';
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

function doPrint() {
  var f = readFilter(ui.filter);
  var rows = reportRows(f);
  var total = rows.reduce(function (acc, r) { return acc + (r.mainQty || 0); }, 0);
  var showMonth = !f.month;
  var html = '<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>چاپ گزارش</title>' +
    '<style>' + BASE_CSS + '</style></head><body>' +
    '<main class="container">' +
    '<div class="actions no-print" style="margin-bottom:14px">' +
    '<button class="btn btn-primary" onclick="window.print()">چاپ / ذخیره PDF</button>' +
    '<button class="btn btn-ghost" onclick="window.close()">بازگشت به گزارش</button>' +
    '</div>' +
    '<div class="print-head">' +
    '<div class="print-title">گزارش رسید ماهانه</div>' +
    '<div class="subtle">' + esc(filterText(f)) + '</div>' +
    '</div>' +
    '<table class="data report-table">' +
    '<thead><tr><th style="width:50px">ردیف</th><th>گروه محصول</th>' +
    '<th style="width:200px">مقدار به واحد اصلی (کیلوگرم)</th></tr></thead>' +
    '<tbody>' + reportRowsHtml(rows, showMonth) + '</tbody>' +
    '<tfoot><tr><td></td><td class="text">جمع کل</td><td>' + fmtNum(total, 2) + '</td></tr></tfoot>' +
    '</table>' +
    '</main>' +
    '</body></html>';
  var w = window.open('', '_blank');
  if (!w) { alert('پنجره چاپ توسط مرورگر مسدود شد.'); return; }
  w.document.write(html);
  w.document.close();
}

/* ================= date picker ================= */
function setupPickers() {
  document.querySelectorAll('input.js-date').forEach(setupPicker);
}
function setupPicker(input) {
  if (input.dataset.picker) return;
  input.dataset.picker = '1';
  var wrap = document.createElement('div');
  wrap.className = 'dp-wrap';
  input.parentNode.insertBefore(wrap, input);
  wrap.appendChild(input);

  var pop = document.createElement('div');
  pop.className = 'dp-pop';
  wrap.appendChild(pop);

  var pst = { jy: 0, jm: 0 };
  var initial = J.parse(input.value) || J.today();
  pst.jy = initial.jy;
  pst.jm = initial.jm;

  function currentSelection() { return J.parse(input.value); }

  function renderPop() {
    var sel = currentSelection();
    var today = J.today();
    var first = J.toGregorian(pst.jy, pst.jm, 1);
    var jsDay = new Date(first.gy, first.gm - 1, first.gd).getDay();
    var offset = (jsDay + 1) % 7;
    var len = J.jalaaliMonthLength(pst.jy, pst.jm);

    var h = '<div class="dp-head">' +
      '<button type="button" data-nav="-1" title="ماه قبل">‹</button>' +
      '<span class="dp-title">' + J.MONTHS[pst.jm - 1] + ' ' + faDigits(pst.jy) + '</span>' +
      '<button type="button" data-nav="1" title="ماه بعد">›</button>' +
      '</div><div class="dp-grid">';
    J.WEEKDAYS.forEach(function (w) { h += '<span class="wd">' + w + '</span>'; });
    for (var i = 0; i < offset; i += 1) h += '<span class="blank"></span>';
    for (var d = 1; d <= len; d += 1) {
      var cls = '';
      if (sel && sel.jy === pst.jy && sel.jm === pst.jm && sel.jd === d) cls = 'sel';
      else if (today.jy === pst.jy && today.jm === pst.jm && today.jd === d) cls = 'today';
      h += '<button type="button" class="' + cls + '" data-day="' + d + '">' + faDigits(d) + '</button>';
    }
    h += '</div>';
    pop.innerHTML = h;

    pop.querySelectorAll('[data-nav]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        pst.jm += Number(btn.getAttribute('data-nav'));
        if (pst.jm < 1) { pst.jm = 12; pst.jy -= 1; }
        if (pst.jm > 12) { pst.jm = 1; pst.jy += 1; }
        renderPop();
      });
    });
    pop.querySelectorAll('[data-day]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var d = btn.getAttribute('data-day');
        input.value = faDigits(pst.jy) + '/' + faDigits(J.pad2(pst.jm)) + '/' + faDigits(J.pad2(d));
        close();
        input.dispatchEvent(new Event('change', { bubbles: true }));
      });
    });
  }

  function open() {
    var parsed = J.parse(input.value) || J.today();
    pst.jy = parsed.jy;
    pst.jm = parsed.jm;
    renderPop();
    pop.classList.add('open');
  }
  function close() { pop.classList.remove('open'); }

  input.addEventListener('focus', open);
  input.addEventListener('click', open);
  input.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  document.addEventListener('click', function (e) {
    if (!wrap.contains(e.target)) close();
  });
}

/* ================= navigation & boot ================= */
var BASE_CSS = document.querySelector('style').textContent;

function render() {
  document.querySelectorAll('#nav a').forEach(function (a) {
    a.classList.toggle('active', a.getAttribute('data-page') === (ui.form ? 'catalog' : ui.page));
  });
  if (ui.form) renderCatalogForm();
  else if (ui.page === 'report') renderReport();
  else if (ui.page === 'import') renderImport();
  else if (ui.page === 'catalog') renderCatalog();
  window.scrollTo(0, 0);
}

nav.addEventListener('click', function (e) {
  var a = e.target.closest('a[data-page]');
  if (!a) return;
  e.preventDefault();
  ui.page = a.getAttribute('data-page');
  ui.form = null;
  render();
});

// دکمه ذخیره در فایل HTML
document.getElementById('btn-save-html').addEventListener('click', function () {
  if (!state) return;
  save();
  if (saveToHtmlFile()) {
    dirty = false;
    updateDirtyBadge();
    alert('✅ فایل جدید دانلود شد.\n\nآن را جایگزین فایل قبلی در پوشه مشترک کنید تا سایر سیستم‌ها داده جدید را ببینند.');
  }
});

// هشدار هنگام بستن صفحه با تغییرات ذخیره‌نشده
window.addEventListener('beforeunload', function (e) {
  if (dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

state = loadState();
render();
</script>
